<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper...</title>
    <link rel="stylesheet" href="rpsOneSty.css">
    <script src="rpsGame.js" defer></script>

</head>

<body>
    <div class="main_game-container">
        <div class="selector" data-selection="rock">✊</div>
        <div class="selector" data-selection="paper">🖐️</div>
        <div class="selector" data-selection="scissors">✌️</div>
    </div>
    <div class="score-container">
        <div class="player-container">
            <h4>Player</h4>
            <p data-player-score>0</p>
        </div>
        <div data-final-column class="player-container">
            <h4>Computer</h4>
            <p data-computer-score>0</p>
        </div>
    </div>
</body>

</html>
